# 本仓库对《项目管理标准》的采用记录。
# 这个仓库既是标准的产地，也是它的第一个采用者——自己不用的标准不可信。
# 采用的标准修订不在本文件，见 governance/STANDARD_VERSION（01 §8）
tier: L1                              # 一人多会话；依据 templates/文件树与落地路径.md §8

layout:
  entry:
    - CONTEXT_MANIFEST.md             # 本仓库的入口叫这个名字，不叫 AGENTS.md
  docs_root: docs
  # work_root 不配：本仓库确实没有工作项目录（git ls-files 里没有任何 WI-* 或
  # state/ 条目），原先写的 docs/state/work 并不存在，是一句假事实。删掉之后
  # layout 的实时状态源（work_current）一项记一条未定——那是诚实结果；evidence/freshness
  # 按默认常量找不到目录，各记一条 SKIP 指向 layout，不重复报（CONTRACT §1）。
  artifacts:                          # 本仓库的工件叫别的名字，按 01 §3.1「可按职责合并映射」登记
    status: PROJECT_STATUS.md
    # 本仓库确实没有验收条目工件。声明落点是为了让它报 FAIL 而不是未定——
    # "我没有这件工件" 与 "我没告诉你它在哪" 是两件事，前者是失败，后者才是未定。
    acceptance: docs/product/acceptance/
  frozen:                             # 只读区：抓来的原文与历史归档，不承担更新义务
    - docs/归档                       # 已消化的输入目录归档区，见 docs/归档/README.md
    - docs/参考资料
    - docs/参考资料-Claude
    - docs/审计记录

budgets:
  entry_lines: 150
  stale_days: 90
  work_item_stale_days: 14

tailoring:
  - check: cross-repo
    applicable: false
    reason: 单仓项目，01 §3.8 记不适用
